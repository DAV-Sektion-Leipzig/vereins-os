<h2>Passwort zurücksetzen</h2>
<p>Für deinen Zugang zum Vereins OS wurde ein neues Passwort angefordert.</p>
<p>Über den folgenden Link setzt du ein neues Passwort:</p>
<p><a href="{{ .SiteURL }}/passwort-setzen?token_hash={{ .TokenHash }}&amp;type=recovery">Neues Passwort setzen</a></p>
<p>Wenn du kein neues Passwort angefordert hast, kannst du diese E-Mail ignorieren. Dein bisheriges Passwort bleibt gültig.</p>
