<h2>Einladung ins Vereins OS</h2>
<p>Du wurdest ins Vereins OS der Sektion eingeladen.</p>
<p>Über den folgenden Link setzt du dein Passwort und aktivierst deinen Zugang:</p>
<p><a href="{{ .SiteURL }}/passwort-setzen?token_hash={{ .TokenHash }}&amp;type=invite">Passwort setzen</a></p>
<p>Wenn du keine Einladung erwartet hast, kannst du diese E-Mail ignorieren.</p>
