# Datenbanktests (pgTAP) und Tests der Edge Functions mit lokalem Supabase-Stack.
# Greift nie auf vereins-os-test oder vereins-os-prod zu; braucht nur das Secret SEED_TEST_PASSWORD.
name: Datenbanktests

on:
  pull_request:

permissions:
  contents: read

jobs:
  db-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: psql bereitstellen
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Lokalen Stack starten
        run: supabase start

      - name: Verbindung zum lokalen Stack lesen
        run: |
          db_url="$(supabase status -o env | sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          test -n "$db_url"
          echo "DB_URL=$db_url" >> "$GITHUB_ENV"

      # Block A: Einrichtungsskript PROD auf leerer Datenbank (nur lokal)
      - name: "Block A: Einrichtungsskript zweimal ausführen"
        run: |
          supabase db reset
          for i in 1 2; do
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -v admin_first=Erika -v admin_last=Beispiel \
              -v admin_email=erika.beispiel@dav-leipzig.de \
              -f supabase/setup/prod-bootstrap.sql
          done

      - name: "Block A: Einrichtungsskript prüfen"
        run: supabase test db supabase/tests/bootstrap

      - name: "Block A: Abbruch bei eingetragener Testdomain"
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "insert into public.ad_test_login_domains (domain) values ('example.test')"
          if psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -v admin_first=Erika -v admin_last=Beispiel \
              -v admin_email=erika.beispiel@dav-leipzig.de \
              -f supabase/setup/prod-bootstrap.sql; then
            echo "Erwartet: Abbruch, weil ad_test_login_domains Einträge hat."
            exit 1
          fi

      # Block B: Seed und Rechte-Tests
      - name: "Block B: Seed"
        env:
          SEED_TEST_PASSWORD: ${{ secrets.SEED_TEST_PASSWORD }}
        run: |
          supabase db reset
          SEED_DB_URL="$DB_URL" supabase/seed.sh

      - name: "Block B: pgTAP-Tests"
        run: supabase test db supabase/tests/database

      - name: Tests der Edge Functions
        run: |
          shopt -s nullglob globstar
          tests=(supabase/functions/**/*.test.ts)
          if (( ${#tests[@]} )); then
            deno test --allow-env --allow-net "${tests[@]}"
          else
            echo "Noch keine Tests für Edge Functions."
          fi
